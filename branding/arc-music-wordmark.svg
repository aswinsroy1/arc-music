<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200">
  <defs>
    <linearGradient id="arcGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9DB6D9"/>
      <stop offset="55%" stop-color="#5C86A8"/>
      <stop offset="100%" stop-color="#8A5468"/>
    </linearGradient>
    <radialGradient id="glowA2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5C86A8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5C86A8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="640" height="200" rx="28" fill="#000000"/>
  <circle cx="90" cy="100" r="110" fill="url(#glowA2)" filter="url(#softBlur2)"/>

  <!-- compact arc mark -->
  <g transform="translate(90 100)">
    <circle
      r="52"
      fill="none"
      stroke="url(#arcGradient2)"
      stroke-width="14"
      stroke-linecap="round"
      stroke-dasharray="245 327"
      transform="rotate(-45)"
    />
    <circle cx="36.8" cy="-36.8" r="7" fill="#F2F2ED"/>
  </g>

  <!-- wordmark, matching in-app type treatment: weight 800, tight tracking -->
  <text x="176" y="118" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif"
        font-size="64" font-weight="800" letter-spacing="-1.3" fill="#F2F2ED">Arc<tspan fill="rgba(242,242,237,0.52)" font-weight="600"> Music</tspan></text>
</svg>
